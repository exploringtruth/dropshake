<svg xmlns="http://www.w3.org/2000/svg" width="82" height="20" viewBox="0 0 82 20" role="img" aria-labelledby="title">
  <title id="title">macOS 13+</title>
  <defs>
    <clipPath id="corners"><rect width="82" height="20" rx="3"/></clipPath>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="48" height="20" fill="#555"/>
    <rect x="48" width="34" height="20" fill="#79e89c"/>
    <rect width="82" height="20" fill="url(#shine)"/>
  </g>
  <g fill="#fff" font-family="Verdana, Geneva, sans-serif" font-size="11" text-anchor="middle">
    <text x="24" y="14">macOS</text>
    <text x="65" y="14" fill="#10351d">13+</text>
  </g>
</svg>
