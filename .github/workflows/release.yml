name: Build and publish DMG

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: VERSION="${GITHUB_REF_NAME#v}" bash ./scripts/build-dmg.sh
      - name: Create stable download name
        run: cp "Dropshake-${GITHUB_REF_NAME#v}.dmg" Dropshake.dmg
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$RELEASE_NOTES" ]]; then
            gh release create "$GITHUB_REF_NAME" "Dropshake-${GITHUB_REF_NAME#v}.dmg" Dropshake.dmg --notes-file "$RELEASE_NOTES" --title "Dropshake $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "Dropshake-${GITHUB_REF_NAME#v}.dmg" Dropshake.dmg --generate-notes --title "Dropshake $GITHUB_REF_NAME"
          fi
